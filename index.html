
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Beauty Industry News Hub</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family: Arial, sans-serif;
      background:#0f0f0f;
      color:white;
      padding:20px;
    }

    h1{
      text-align:center;
      margin-bottom:25px;
      color:#ff69b4;
    }

    .top-bar{
      display:flex;
      justify-content:center;
      margin-bottom:25px;
    }

    input{
      width:320px;
      padding:12px;
      border:none;
      border-radius:8px;
      outline:none;
      font-size:16px;
    }

    .news-container{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
      gap:20px;
    }

    .card{
      background:#1b1b1b;
      border-radius:12px;
      overflow:hidden;
      transition:0.3s;
      border:1px solid #2c2c2c;
    }

    .card:hover{
      transform:translateY(-5px);
      box-shadow:0 0 15px rgba(255,105,180,0.4);
    }

    .card img{
      width:100%;
      height:220px;
      object-fit:cover;
      background:#333;
    }

    .card-content{
      padding:15px;
    }

    .card h3{
      margin-bottom:10px;
      line-height:1.4;
      color:#ffb6d9;
    }

    .card p{
      color:#cfcfcf;
      font-size:14px;
      line-height:1.6;
      margin-bottom:12px;
    }

    .meta{
      display:flex;
      justify-content:space-between;
      color:#999;
      font-size:12px;
      margin-bottom:12px;
    }

    .btn{
      display:inline-block;
      background:#ff69b4;
      color:white;
      padding:10px 14px;
      text-decoration:none;
      border-radius:8px;
      transition:0.3s;
    }

    .btn:hover{
      background:#ff3f9f;
    }

    .loading{
      text-align:center;
      margin-top:50px;
      font-size:18px;
      color:#ccc;
    }
  </style>
</head>
<body>

  <h1>Beauty Industry News Hub</h1>

  <div class="top-bar">
    <input
      type="text"
      id="searchInput"
      placeholder="Search beauty news..."
    />
  </div>

  <div id="loading" class="loading">
    Loading latest beauty news...
  </div>

  <div class="news-container" id="newsContainer"></div>

  <script>

    const newsContainer = document.getElementById("newsContainer");
    const loading = document.getElementById("loading");
    const searchInput = document.getElementById("searchInput");

    let allArticles = [];

    async function fetchBeautyNews() {

      try {

        // Google News RSS for Beauty Industry
        const rssFeed =
          "https://news.google.com/rss/search?q=beauty+industry";

        // RSS -> JSON Converter
        const apiUrl =
          `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssFeed)}`;

        const response = await fetch(apiUrl);

        const data = await response.json();

        allArticles = data.items || [];

        renderNews(allArticles);

      } catch (error) {

        loading.innerHTML = "Failed to load news.";

        console.error(error);
      }
    }

    function renderNews(articles) {

      loading.style.display = "none";

      newsContainer.innerHTML = "";

      if(articles.length === 0){

        newsContainer.innerHTML =
          "<h2>No matching news found.</h2>";

        return;
      }

      articles.forEach(article => {

        const image =
          article.thumbnail ||
          "https://via.placeholder.com/400x220?text=Beauty+News";

        const date = new Date(article.pubDate)
          .toLocaleDateString();

        const card = `
          <div class="card">

            <img src="${image}" alt="news image">

            <div class="card-content">

              <h3>${article.title}</h3>

              <div class="meta">
                <span>${date}</span>
                <span>Beauty News</span>
              </div>

              <p>
                ${article.description
                  .replace(/(<([^>]+)>)/gi, "")
                  .substring(0, 140)}...
              </p>

              <a
                class="btn"
                href="${article.link}"
                target="_blank"
              >
                Read More
              </a>

            </div>

          </div>
        `;

        newsContainer.innerHTML += card;
      });
    }

    searchInput.addEventListener("input", function(){

      const value = this.value.toLowerCase();

      const filtered = allArticles.filter(article =>
        article.title.toLowerCase().includes(value) ||
        article.description.toLowerCase().includes(value)
      );

      renderNews(filtered);

    });

    fetchBeautyNews();

  </script>

</body>
</html>
